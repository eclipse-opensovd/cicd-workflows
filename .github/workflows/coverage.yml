name: Coverage

on:
  workflow_call:
    inputs:
      rust-version:
        description: "Rust toolchain version (default: nightly)"
        type: string
        default: "nightly"
      cargo-locked:
        description: "Use --locked flag for cargo commands"
        type: boolean
        default: true
      coverage-threshold:
        description: "Minimum line coverage percentage (0 to disable enforcement)"
        type: number
        default: 0
      exclude-crates:
        description: "Space-separated list of crates to exclude from coverage"
        type: string
        default: ""
      ignore-filename-regex:
        description: "Regex for filenames to ignore in coverage"
        type: string
        default: ""
      cargo-extra-args:
        description: "Extra arguments appended to every cargo llvm-cov invocation (e.g. '--features integration-tests')"
        type: string
        default: ""
      post-pr-comment:
        description: >-
          Generate a coverage PR comment and upload it as the 'pr-comment-coverage' artifact. For non-fork PRs the comment is also posted directly (requires pull-requests: write in the caller). Fork PRs can be handled by a workflow_run workflow that calls post-pr-comments.yml.
        type: boolean
        default: false

permissions:
  contents: read
  # pull-requests: write is required when post-pr-comment input is true.
  # The caller workflow must grant this permission explicitly.
  pull-requests: write

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-26.04
    env:
      IGNORE_REGEX: ${{ inputs.ignore-filename-regex }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.rust-version }}
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build exclude flags
        id: flags
        shell: bash
        run: |
          LOCKED="${{ inputs.cargo-locked && '--locked' || '' }}"
          EXCLUDES=""
          for crate in ${{ inputs.exclude-crates }}; do
            EXCLUDES="$EXCLUDES --exclude $crate"
          done
          echo "locked=$LOCKED" >> "$GITHUB_OUTPUT"
          echo "excludes=$EXCLUDES" >> "$GITHUB_OUTPUT"
          echo "extra=${{ inputs.cargo-extra-args }}" >> "$GITHUB_OUTPUT"

      - name: Generate coverage (LCOV)
        shell: bash
        run: |
          ARGS=(--workspace ${{ steps.flags.outputs.locked }} ${{ steps.flags.outputs.excludes }} ${{ steps.flags.outputs.extra }})
          if [ -n "$IGNORE_REGEX" ]; then
            ARGS+=(--ignore-filename-regex "$IGNORE_REGEX")
          fi
          cargo llvm-cov "${ARGS[@]}" --lcov --output-path lcov.info

      - name: Generate coverage summary
        id: coverage
        shell: bash
        run: |
          ARGS=(--workspace ${{ steps.flags.outputs.locked }} ${{ steps.flags.outputs.excludes }} ${{ steps.flags.outputs.extra }})
          if [ -n "$IGNORE_REGEX" ]; then
            ARGS+=(--ignore-filename-regex "$IGNORE_REGEX")
          fi
          cargo llvm-cov "${ARGS[@]}" --json --no-run --output-path coverage.json
          TOTAL_LINE_COV=$(jq '.data[0].totals.lines.percent' coverage.json)
          rm -f coverage.json

          REPORT=$(cargo llvm-cov "${ARGS[@]}" --no-run 2>&1)
          echo "$REPORT"

          echo "total_coverage=$TOTAL_LINE_COV" >> "$GITHUB_OUTPUT"
          echo "### Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total line coverage: ${TOTAL_LINE_COV}%**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

      - name: Enforce coverage threshold
        if: ${{ inputs.coverage-threshold > 0 }}
        shell: bash
        run: |
          COVERAGE="${{ steps.coverage.outputs.total_coverage }}"
          THRESHOLD="${{ inputs.coverage-threshold }}"
          echo "Coverage: ${COVERAGE}%, Threshold: ${THRESHOLD}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

      - name: Generate coverage comment body
        if: ${{ inputs.post-pr-comment && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          mkdir -p pr-comment-coverage
          echo "${{ github.event.number }}" > pr-comment-coverage/pr_number
          MARKER='<!-- coverage-report -->'
          TOTAL='${{ steps.coverage.outputs.total_coverage }}'
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SYMBOL="$(printf '\xf0\x9f\x93\x8a')"
          printf '%s\n' \
            "${MARKER}" \
            "### ${SYMBOL} Coverage Report" \
            '' \
            "**Total line coverage: ${TOTAL}%**" \
            '' \
            "[Full build artifacts](${RUN_URL})" \
            > pr-comment-coverage/body.md

      - name: Upload coverage comment artifact
        if: ${{ inputs.post-pr-comment && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-comment-coverage
          path: pr-comment-coverage/

      # Post directly for non-fork PRs (instant feedback).
      # Fork PRs lack write permissions and cannot directly post comments.
      # they can be handled by a separate workflow_run workflow that calls
      # post-pr-comments.yml.
      - name: Post coverage comment on PR
        if: >-
          inputs.post-pr-comment && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment-coverage/body.md', 'utf8');
            const marker = '<!-- coverage-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
