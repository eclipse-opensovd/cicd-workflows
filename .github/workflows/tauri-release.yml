name: Tauri Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'
  workflow_call:
    inputs:
      app-name:
        description: >
          Human-readable release name prefix, e.g. "MDD UI". Used in releaseName: "<app-name> <tag>".
        type: string
        required: true

      app-binary-name:
        description: >
          Binary name of the app, e.g. "mdd-ui". Required for asset renaming (adds OS/Ubuntu-version suffix to .deb and other bundle filenames). If omitted, the rename step will fail.
        type: string
        required: true

      tauri-conf-path:
        description: "Relative path to tauri.conf.json (default: tauri.conf.json)"
        type: string
        default: "tauri.conf.json"

      cargo-toml-path:
        description: "Relative path to Cargo.toml (default: Cargo.toml)"
        type: string
        default: "Cargo.toml"

      frontend-dir:
        description: "Directory that contains package.json (default: frontend)"
        type: string
        default: "frontend"

      package-manager:
        description: "Frontend package manager: 'bun' or 'npm' (default: bun)"
        type: string
        default: "bun"

      bun-version:
        description: "Bun version to install when package-manager is 'bun' (default: latest)"
        type: string
        default: "latest"

      node-version:
        description: "Node.js version to install when package-manager is 'npm' (default: 22)"
        type: string
        default: "22"

      rust-version:
        description: "Rust toolchain version (default: stable)"
        type: string
        default: "stable"

      release-draft:
        description: "Publish release as a draft (default: false)"
        type: boolean
        default: false

      prerelease:
        description: >
          Mark release as a pre-release (default: false). Tags containing '-rc', '-alpha', or '-beta' (e.g. v1.2.3-rc.1) are always treated as pre-releases regardless of this input.
        type: boolean
        default: false


        

      build-ubuntu-26-04:

      build-linux:
        description: "Include the Linux (ubuntu-26.04) build (default: true)"
        type: boolean
        default: true

      build-macos-arm:
        description: "Include the macOS aarch64 build (default: true)"
        type: boolean
        default: true

      build-windows:
        description: "Include the Windows x64 build (default: true)"
        type: boolean
        default: true

      signing-private-key-secret:
        description: >
          Name of the repository / org secret that holds the Tauri signing private key (TAURI_SIGNING_PRIVATE_KEY). Leave empty to skip signing.
        type: string
        default: "TAURI_SIGNING_PRIVATE_KEY"

      signing-private-key-password-secret:
        description: >
          Name of the repository / org secret that holds the Tauri signing private key password (TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
        type: string
        default: "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: "Tauri signing private key (optional)"
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: "Tauri signing private key password (optional)"
        required: false

permissions:
  contents: write

