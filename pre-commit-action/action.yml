name: 'OpenSOVD Pre-Commit Checks'
description: 'Runs pre-commit hooks via prek using the repository .pre-commit-config.yaml'
inputs:
  rust-toolchain:
    description: 'Rust toolchain to install (e.g. "stable", "nightly-2025-07-14")'
    required: false
    default: 'stable'
  go-version:
    description: 'Go version for gitleaks hook'
    required: false
    default: '1.25'
runs:
  using: 'composite'
  steps:
    - name: Install Rust nightly toolchain (required for nightly checks)
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt, clippy
        cache-shared-key: ci-nightly
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: rustfmt, clippy
        cache-shared-key: ci
    - name: Install Go (required for gitleaks)
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install tools
      shell: bash
      run: |
        uv tool install prek
        uv tool install reuse>=5.0.2
    - name: Cache prek hooks
      uses: actions/cache@v5
      with:
        path: ~/.cache/prek
        key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          prek-${{ runner.os }}-
    - name: Run pre-commit checks
      shell: bash
      run: prek run --all-files --show-diff-on-failure
